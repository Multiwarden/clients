blank_issues_enabled: false
contact_links:
  - name: Report a security vulnerability
    url: https://github.com/multiwarden/clients/security/advisories/new
    about: Please report security problems privately, never in a public issue.
  - name: Problem with the official Bitwarden extension
    url: https://github.com/bitwarden/clients/issues
    about: If the official Bitwarden extension has the same problem, report it to Bitwarden.
  - name: Bitwarden account or server help
    url: https://bitwarden.com/contact/
    about: Multiwarden cannot help with Bitwarden accounts, billing or servers.
