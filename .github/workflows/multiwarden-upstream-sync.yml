# Multiwarden: brings in each new Bitwarden browser extension release, checked every night.
#
# Multiwarden follows Bitwarden's released extension (tags like browser-v2026.12.0), not their
# `main` branch, so every Multiwarden version is built on code Bitwarden has shipped.
# Multiwarden's history starts from a snapshot of upstream (see multiwarden/upstream-commit),
# so a release is applied as a patch from the last synced commit to the release tag, with a
# 3-way merge. The result is opened as a pull request:
#   - clean apply   -> the Multiwarden CI workflow builds and tests it, then merges the PR and
#                      publishes a release (see the "Merge sync" job in multiwarden-ci.yml).
#   - conflicts     -> a PR titled "[conflicts]" containing conflict markers to resolve.
#
# Requires: Settings -> Actions -> General -> "Allow GitHub Actions to create and approve
# pull requests".
name: Multiwarden upstream sync

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      version:
        description: "Bitwarden browser version to sync to, e.g. 2026.12.0 (default: the newest)"
        type: string
        default: ""

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: multiwarden-upstream-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Multiwarden
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Fetch upstream
        run: |
          git remote add upstream https://github.com/bitwarden/clients.git
          # Release tags go to their own namespace so they are never pushed to Multiwarden.
          git fetch --no-tags upstream main \
            "+refs/tags/browser-v*:refs/upstream-tags/browser-v*"

      - name: Find the release to sync to
        id: range
        env:
          REQUESTED: ${{ inputs.version }}
        run: |
          current="$(node -p 'require("./apps/browser/src/manifest.json").version')"
          if [ -n "$REQUESTED" ]; then
            target="$REQUESTED"
          else
            # Newest stable release (no -beta or -rc suffix).
            target="$(git for-each-ref --format='%(refname:lstrip=2)' refs/upstream-tags \
              | sed -n 's/^browser-v\([0-9]*\.[0-9]*\.[0-9]*\)$/\1/p' | sort -V | tail -n 1)"
          fi
          if ! git rev-parse -q --verify "refs/upstream-tags/browser-v$target" > /dev/null; then
            echo "::error::Bitwarden has no release tag browser-v$target"
            exit 1
          fi
          echo "Multiwarden is on Bitwarden $current; newest release is $target"
          newest="$(printf '%s\n%s\n' "$current" "$target" | sort -V | tail -n 1)"
          if [ -z "$REQUESTED" ] && { [ "$target" = "$current" ] || [ "$newest" = "$current" ]; }; then
            echo "Already on the newest Bitwarden release"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          last="$(tr -d '[:space:]' < multiwarden/upstream-commit)"
          new="$(git rev-parse "refs/upstream-tags/browser-v$target^{commit}")"
          if [ "$last" = "$new" ]; then
            echo "Already synced to $target"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          branch="sync/bitwarden-$target"
          if git ls-remote --exit-code --heads origin "$branch" > /dev/null; then
            echo "A sync PR for Bitwarden $target already exists"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "current=$current"
            echo "target=$target"
            echo "last=$last"
            echo "new=$new"
            echo "short=${new:0:9}"
            echo "branch=$branch"
            echo "changed=true"
          } >> "$GITHUB_OUTPUT"

      - name: Apply upstream changes
        if: steps.range.outputs.changed == 'true'
        id: apply
        run: |
          git config user.name "multiwarden-sync[bot]"
          git config user.email "multiwarden-sync@users.noreply.github.com"
          git switch -c "${{ steps.range.outputs.branch }}"

          # Paths listed in multiwarden/upstream-removed-paths stay out of Multiwarden.
          excluded=()
          while read -r path; do
            excluded+=(":(exclude)$path")
          done < <(grep -v '^#' multiwarden/upstream-removed-paths | grep -v '^$')
          git diff --binary "${{ steps.range.outputs.last }}" "${{ steps.range.outputs.new }}" \
            -- . "${excluded[@]}" > /tmp/upstream.patch
          if git apply --3way --index /tmp/upstream.patch 2> /tmp/apply.log; then
            echo "conflicts=false" >> "$GITHUB_OUTPUT"
          else
            echo "conflicts=true" >> "$GITHUB_OUTPUT"
            cat /tmp/apply.log
            # Keep conflict markers so they can be resolved on the PR branch.
            git add -A
          fi
          git diff --cached --name-only --diff-filter=U > /tmp/conflicts.txt || true
          grep -rlI --exclude-dir=node_modules --exclude-dir=.git -e '^<<<<<<< ' . > /tmp/markers.txt || true

          # A new Bitwarden version starts the Multiwarden release number at 1 again
          # (version = <Bitwarden version>.<release>, see multiwarden/README.md).
          read_version='JSON.parse(require("fs").readFileSync(0, "utf8")).version'
          old_version="$(git show HEAD:apps/browser/src/manifest.json | node -p "$read_version")"
          new_version="$(node -p "$read_version" < apps/browser/src/manifest.json 2> /dev/null || echo "$old_version")"
          if [ "$old_version" != "$new_version" ]; then
            echo "Bitwarden $old_version -> $new_version: resetting the Multiwarden release to 1"
            printf '{\n  "release": 1\n}\n' > multiwarden/version.json
            git add multiwarden/version.json
          fi

          echo "${{ steps.range.outputs.new }}" > multiwarden/upstream-commit
          git add multiwarden/upstream-commit
          git commit -m "Sync with Bitwarden browser ${{ steps.range.outputs.target }}" \
            -m "Applies bitwarden/clients ${{ steps.range.outputs.last }}..${{ steps.range.outputs.new }} (tag browser-v${{ steps.range.outputs.target }})."
          git push origin "${{ steps.range.outputs.branch }}"

      - name: Open pull request
        if: steps.range.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last="${{ steps.range.outputs.last }}"
          new="${{ steps.range.outputs.new }}"
          {
            target="${{ steps.range.outputs.target }}"
            echo "Updates Multiwarden from Bitwarden ${{ steps.range.outputs.current }} to [Bitwarden browser ${target}](https://github.com/bitwarden/clients/releases/tag/browser-v${target}) ([all changes](https://github.com/bitwarden/clients/compare/${last}...${new}))."
            echo
            if [ "${{ steps.apply.outputs.conflicts }}" = "true" ]; then
              echo "## Conflicts"
              echo
              echo "Some upstream changes touch code Multiwarden also changed. Files with conflict markers:"
              echo
              sed 's/^/- `/; s/$/`/' /tmp/markers.txt
              echo
              echo "Resolve them on this branch (see multiwarden/README.md for what each Multiwarden hook does), then merge."
            else
              echo "Applied cleanly. Multiwarden CI merges this PR and publishes a release once its checks pass."
            fi
          } > /tmp/body.md
          title="Sync with Bitwarden browser ${{ steps.range.outputs.target }}"
          if [ "${{ steps.apply.outputs.conflicts }}" = "true" ]; then
            title="[conflicts] $title"
          fi
          gh pr create --base main --head "${{ steps.range.outputs.branch }}" --title "$title" --body-file /tmp/body.md
          # PRs opened with the workflow token do not trigger pull_request workflows, so start
          # the Multiwarden CI build on the sync branch explicitly.
          gh workflow run multiwarden-ci.yml --ref "${{ steps.range.outputs.branch }}"
