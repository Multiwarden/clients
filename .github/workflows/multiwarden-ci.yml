# Multiwarden: tests the Multiwarden changes and builds the extension for every browser and the
# desktop app for Windows, macOS and Linux. It publishes a GitHub release with one zip per
# browser, the desktop installers, plus the source package Firefox Add-ons asks for, when started from the Actions tab with "release" ticked (it then creates the
# tag itself), or when a tag like v2026.11.0.1 is pushed. A release is also uploaded to the
# Chrome Web Store when its secrets are set (see the "Chrome Web Store" job).
#
# On an upstream sync branch (sync/bitwarden-*) that passes every check, the "Merge sync" job
# merges the sync PR and starts a release, so new Bitwarden versions ship without manual steps.
#
# Release checklist: bump "release" in multiwarden/version.json and commit, then run this
# workflow on main with "release" ticked. The tag is v<bitwarden version>.<release>.
name: Multiwarden CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish a release (creates the version tag)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        # Upstream's lock file is occasionally out of step with package.json.
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Check translations
        run: node multiwarden/scripts/check-translations.mjs

      - name: Check Multiwarden hooks in Bitwarden's files
        run: node multiwarden/scripts/check-hooks.mjs

      - name: Lint Multiwarden code
        run: |
          npx eslint libs/common/src/multiwarden libs/angular/src/multiwarden \
            apps/browser/src/multiwarden apps/browser/src/autofill/multiwarden \
            apps/desktop/src/multiwarden
          npx prettier --check libs/common/src/multiwarden libs/angular/src/multiwarden \
            apps/browser/src/multiwarden apps/browser/src/autofill/multiwarden \
            apps/desktop/src/multiwarden multiwarden/scripts

      - name: Test Multiwarden changes
        run: |
          (cd libs/common && npx jest src/multiwarden src/platform/services/fido2)
          (cd libs/angular && npx jest src/multiwarden)
          (cd libs/tools/send/send-ui && npx jest)
          (cd libs/vault && npx jest src/components/vault-items-table src/vault-item-dialog)
          (cd apps/desktop && npx jest --runInBand \
            src/multiwarden \
            src/vault/app/vault-v3 \
            src/auth/components/account-switcher \
            src/app/accounts/settings-dialog.component.spec.ts \
            src/main/native-messaging.main.spec.ts)
          (cd apps/browser && npx jest --runInBand \
            src/multiwarden \
            src/autofill/multiwarden \
            src/autofill/browser \
            src/autofill/services/autofill-badge-updater.service.spec.ts \
            src/vault/popup/services \
            src/tools/popup \
            src/vault/popup/components/vault/vault-list-items-container \
            src/vault/popup/components/vault/vault-popup-list-table \
            src/vault/popup/components/vault/view \
            src/vault/popup/components/vault/add-edit \
            src/auth/popup/account-switching \
            src/popup \
            src/autofill/background/notification.background.spec.ts \
            src/autofill/background/overlay.background.spec.ts \
            src/autofill/background/autofill-orchestrator.spec.ts \
            src/autofill/services/autofill.service.spec.ts \
            src/autofill/notification \
            src/autofill/content/components/notification \
            src/autofill/fido2 \
            src/autofill/popup/fido2)

  build:
    name: Build ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - browser: chrome
            manifest: "3"
          - browser: edge
            manifest: "3"
          - browser: opera
            manifest: "3"
          - browser: firefox
            manifest: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (open-source build only)
        working-directory: apps/browser
        env:
          NODE_ENV: production
          BROWSER: ${{ matrix.browser }}
          MANIFEST_VERSION: ${{ matrix.manifest }}
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx webpack

      - name: Apply Multiwarden branding and package
        env:
          BROWSER: ${{ matrix.browser }}
        run: |
          node multiwarden/scripts/brand-build.mjs apps/browser/build
          version="$(node -p "require('./apps/browser/build/manifest.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          (cd apps/browser/build && zip -qr "../../../multiwarden-$BROWSER-$version.zip" .)
          # Stores refuse the manifest "key" that fixes the ID of the GitHub builds.
          node multiwarden/scripts/brand-build.mjs apps/browser/build --store
          (cd apps/browser/build && zip -qr "../../../store-$BROWSER-$version.zip" .)

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multiwarden-${{ matrix.browser }}
          path: multiwarden-${{ matrix.browser }}-${{ env.VERSION }}.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: store-${{ matrix.browser }}
          path: store-${{ matrix.browser }}-${{ env.VERSION }}.zip

  build-safari:
    name: Build safari (unsigned)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build (open-source build only)
        working-directory: apps/browser
        env:
          NODE_ENV: production
          BROWSER: safari
          NODE_OPTIONS: --max-old-space-size=8192
        run: npx webpack

      - name: Apply Multiwarden branding
        env:
          BROWSER: safari
        run: |
          node multiwarden/scripts/brand-build.mjs apps/browser/build
          version="$(node -p "require('./apps/browser/build/manifest.json').version")"
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Package unsigned Safari app
        run: |
          bash multiwarden/scripts/package-safari-unsigned.sh \
            "$GITHUB_WORKSPACE/multiwarden-safari-unsigned-$VERSION.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multiwarden-safari
          path: multiwarden-safari-unsigned-${{ env.VERSION }}.zip

  build-desktop:
    name: Build desktop ${{ matrix.os }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: linux
            runner: ubuntu-22.04
            native: --target=x86_64-unknown-linux-gnu --release
            package: --linux --x64
            files: "Multiwarden-*.AppImage Multiwarden-*.deb"
          - os: windows
            runner: windows-2022
            native: --target=x86_64-pc-windows-msvc --release
            package: --win --x64
            files: "Multiwarden-*.exe"
          - os: macos
            runner: macos-15
            # Both architectures, merged into one universal app.
            native: cross-platform --release
            package: --mac --universal
            files: "Multiwarden-*.dmg Multiwarden-*.zip"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Cache Rust build
        uses: Swatinem/rust-cache@779680da715d629ac1d338a641029a2f4372abb5 # v2.8.2
        with:
          workspaces: apps/desktop/desktop_native -> target
          key: ${{ matrix.os }}

      - name: Install Linux build dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install pkg-config libxss-dev

      - name: Install dependencies
        run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund

      - name: Build native module
        working-directory: apps/desktop/desktop_native
        env:
          PKG_CONFIG_ALLOW_CROSS: true
          PKG_CONFIG_ALL_STATIC: true
        run: node build.js ${{ matrix.native }}

      - name: Build (open-source build only)
        working-directory: apps/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: npm run build

      - name: Apply Multiwarden branding
        run: node multiwarden/scripts/brand-desktop.mjs

      - name: Package
        working-directory: apps/desktop
        env:
          # Unsigned builds: no certificates are looked up.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          npx electron-builder --config ../../multiwarden/.build/electron-builder.json \
            ${{ matrix.package }} -p never
          mkdir -p ../../desktop-dist
          cd dist && cp ${{ matrix.files }} ../../../desktop-dist/

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: multiwarden-desktop-${{ matrix.os }}
          path: desktop-dist/*

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release)
    needs: [test, build, build-safari, build-desktop]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: multiwarden-*
          merge-multiple: true

      - name: Package the source for Firefox Add-ons
        run: |
          version="$(ls dist/multiwarden-chrome-*.zip | sed -E 's/.*multiwarden-chrome-(.*)\.zip/\1/')"
          git archive --format=zip --prefix="multiwarden-$version-source/" \
            --add-file=multiwarden/store/AMO-BUILD.md \
            -o "dist/multiwarden-source-$version.zip" HEAD

      - name: Create release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The version is in the zip names: multiwarden-<browser>-<version>.zip
          version="$(ls dist/multiwarden-chrome-*.zip | sed -E 's/.*multiwarden-chrome-(.*)\.zip/\1/')"
          tag="v${version}"
          if gh release view "$tag" --repo "${GITHUB_REPOSITORY}" > /dev/null 2>&1; then
            echo "::error::Release $tag already exists. Bump \"release\" in multiwarden/version.json first."
            exit 1
          fi
          gh release create "$tag" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --target "${GITHUB_SHA}" \
            --title "Multiwarden ${version}" --generate-notes
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Link spec pages in the release notes
        # Adds a "Multiwarden features" section for every "Feature: <id>" line in the pull requests
        # since the previous release. See spec/process.md in multiwarden/multiwarden.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags="$(gh release list --repo "$GITHUB_REPOSITORY" --limit 2 --json tagName --jq '.[].tagName')"
          tag="$(sed -n 1p <<< "$tags")"
          prev="$(sed -n 2p <<< "$tags")"
          if [ -z "$prev" ]; then
            echo "First release, nothing to compare with."
            exit 0
          fi
          curl -fsSL https://raw.githubusercontent.com/multiwarden/multiwarden/main/spec/scripts/feature-notes.sh -o "$RUNNER_TEMP/feature-notes.sh"
          bash "$RUNNER_TEMP/feature-notes.sh" "$GITHUB_REPOSITORY" "$prev" "$GITHUB_SHA" > "$RUNNER_TEMP/features.md"
          if [ -s "$RUNNER_TEMP/features.md" ]; then
            gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body --jq .body > "$RUNNER_TEMP/notes.md"
            printf '\n%s\n' "$(cat "$RUNNER_TEMP/features.md")" >> "$RUNNER_TEMP/notes.md"
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
          fi

  chrome-web-store:
    name: Chrome Web Store
    needs: [release]
    runs-on: ubuntu-latest
    # The secrets are described in multiwarden/store/chrome-web-store.md. Without them this
    # job does nothing, so releases still work before the store listing exists.
    env:
      CWS_CLIENT_ID: ${{ secrets.CWS_CLIENT_ID }}
      CWS_CLIENT_SECRET: ${{ secrets.CWS_CLIENT_SECRET }}
      CWS_REFRESH_TOKEN: ${{ secrets.CWS_REFRESH_TOKEN }}
      CWS_PUBLISHER_ID: ${{ secrets.CWS_PUBLISHER_ID }}
      CWS_EXTENSION_ID: ${{ secrets.CWS_EXTENSION_ID }}
    steps:
      - name: Check for store credentials
        id: check
        run: |
          for name in CWS_CLIENT_ID CWS_CLIENT_SECRET CWS_REFRESH_TOKEN CWS_PUBLISHER_ID CWS_EXTENSION_ID; do
            if [ -z "${!name}" ]; then
              echo "::notice::Secret $name is not set, so this release is not uploaded to the Chrome Web Store."
              echo "ready=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: steps.check.outputs.ready == 'true'
        with:
          name: store-chrome
          path: dist

      - name: Upload and submit for review
        if: steps.check.outputs.ready == 'true'
        run: |
          set -euo pipefail
          api="https://chromewebstore.googleapis.com"
          item="publishers/$CWS_PUBLISHER_ID/items/$CWS_EXTENSION_ID"
          token="$(curl -sSf https://oauth2.googleapis.com/token \
            --data-urlencode "client_id=$CWS_CLIENT_ID" \
            --data-urlencode "client_secret=$CWS_CLIENT_SECRET" \
            --data-urlencode "refresh_token=$CWS_REFRESH_TOKEN" \
            --data-urlencode "grant_type=refresh_token" | jq -r .access_token)"
          echo "::add-mask::$token"
          auth="Authorization: Bearer $token"

          # Refusals that need the Developer Dashboard rather than a code change: the store is
          # still reviewing an earlier version (NOT_UPDATEABLE), or the listing needs attention
          # before it can be submitted (INVALID_ITEM_METADATA). They end the job with a warning, so
          # a release doesn't show as failed; the version can be submitted from the dashboard.
          store_side() {
            local reason
            reason="$(jq -r '.error.details[]? | select(.reason) | .reason' "$1" | head -n1)"
            case "$reason" in
              NOT_UPDATEABLE)
                echo "::warning::The Chrome Web Store is still reviewing an earlier version, so $2 was not uploaded. Re-run this job after the review ends."
                return 0 ;;
              INVALID_ITEM_METADATA)
                echo "::warning::$2 is uploaded to the Chrome Web Store as a draft, but the store refused to submit it: the listing needs attention in the Developer Dashboard. Submit it for review from there."
                return 0 ;;
            esac
            return 1
          }

          zip="$(ls dist/store-chrome-*.zip)"
          version="${{ needs.release.outputs.version }}"
          echo "Uploading $zip"
          curl -sS -H "$auth" -X POST -T "$zip" "$api/upload/v2/$item:upload" | tee /tmp/upload.json
          echo
          if store_side /tmp/upload.json "$version"; then exit 0; fi
          state="$(jq -r '.uploadState // empty' /tmp/upload.json)"
          for attempt in $(seq 1 30); do
            [ "$state" = "IN_PROGRESS" ] || break
            sleep 10
            curl -sS -H "$auth" "$api/v2/$item:fetchStatus" | tee /tmp/status.json
            echo
            state="$(jq -r '.lastAsyncUploadState // .uploadState // empty' /tmp/status.json)"
          done
          if [ "$state" != "SUCCEEDED" ]; then
            echo "::error::Chrome Web Store upload did not succeed (state: ${state:-unknown})"
            exit 1
          fi

          curl -sS -H "$auth" -H "Content-Type: application/json" -X POST -d '{}' \
            "$api/v2/$item:publish" | tee /tmp/publish.json
          echo
          if jq -e '.error' /tmp/publish.json > /dev/null; then
            if store_side /tmp/publish.json "$version"; then exit 0; fi
            echo "::error::Chrome Web Store did not accept the submission"
            exit 1
          fi
          echo "::notice::Multiwarden $version is submitted for Chrome Web Store review."

  merge-sync:
    name: Merge sync
    # Only for the upstream sync branches, started by multiwarden-upstream-sync.yml.
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/sync/bitwarden-')
    needs: [test, build, build-safari, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Merge the sync PR and start a release
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pr="$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$BRANCH" --state open \
            --json number,title,headRefOid --jq '.[0]')"
          if [ -z "$pr" ]; then
            echo "No open PR for $BRANCH"
            exit 0
          fi
          number="$(jq -r .number <<< "$pr")"
          case "$(jq -r .title <<< "$pr")" in
            "[conflicts]"*)
              echo "::notice::PR #$number has conflicts; resolve them and merge it by hand."
              exit 0
              ;;
          esac
          if [ "$(jq -r .headRefOid <<< "$pr")" != "$GITHUB_SHA" ]; then
            echo "::notice::PR #$number has newer commits than this run; not merging."
            exit 0
          fi
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch \
            --match-head-commit "$GITHUB_SHA"
          # Merges made with the workflow token start no workflows, so start the release here.
          # The sync reset "release" to 1 for the new Bitwarden version, so the tag is new.
          gh workflow run multiwarden-ci.yml --repo "$GITHUB_REPOSITORY" --ref main -f release=true
